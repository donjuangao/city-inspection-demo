<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>公众上报 · 设施智能巡检(演示原型)</title>
<link rel="stylesheet" href="assets/tokens.css">
</head>
<body>

<div class="mob">
  <header class="mob-top">
    <b>市政设施上报</b>
    <span class="top-spacer" style="flex:1"></span>
    <span class="top-clock" id="clock">19:00</span>
  </header>

  <main class="mob-body" id="view"></main>

  <footer class="mob-foot">
    上报进兜底并入队列人工甄别升格,不直接进应急 · 联系方式列级脱敏<br>
    <span class="tiny">全站虚构演示数据,零真实照片;证据图为矢量示意</span>
    <span style="float:right"><a href="#" id="btnReset">重置演示</a></span>
  </footer>
</div>

<div class="toasts"></div>

<script src="assets/data.js"></script>
<script src="assets/store.js"></script>
<script src="assets/ui.js"></script>

<!-- ===== 页面体 · 归属 W1-E 工兵 · 开始 =====
     规格:施工图 §7 public.html + 设计档 §3「公众上报轻页三步」/ §2.4 M10 防滥用三件 / §0.9.3 E3 图
     三步提交:①拍一张(矢量示意,点击模拟拍摄)②自动定位(可调:街区下拉)+ 类目三选(路面/井盖/漏水)③提交 → 回执页
     回执页:受理编号 + 状态可查;同点位去重合并时显示「已合并入既有事件,进度同步」;催办计数可见(再次上报=催办+1)
     列级脱敏演示:联系方式显示为 05****xxxx(回执页演示行)
     动作(store 已就绪,唯一状态变更入口 S.commit):
       public_report(params:{cat,block,facility,reportId,actor:'公众'})
       public_urge(params:{reportId,actor:'公众'})
       auto_dedupe(params:{reportId,clueId,actor:'规则引擎'})——同点位有活跃线索时,提交后自动触发一次(M10 防滥用三件之「同点位去重合并」现场可演)
     UI-only 向导态(拍照/步骤/已选街区类目等)不进 store,存在本文件内的闭包变量里,靠 data-nav
     委托点击 + 自派发 'render' 事件重绘;真正改状态的按钮走 data-act → UI.bindActions → S.commit(R53 灰态同规)。
     另:W1-E 还负责横幅机制(暴雨 / 预警广播 / 降级)——横幅数据源 = S.get().banners,
         渲染件 = UI.banner(tone,text) / UI.banners(scope),已在 ui.js 就绪、由壳层 UI.banners('public') 统一挂载。
     =============================================================== -->
<script>
/* W1-E 工兵填充:实现 VIEW_PUBLIC(ctx) 返回页面 HTML。 */
window.VIEW_PUBLIC = (function (w, d) {
  'use strict';

  /* 公众三类目 → 设施台账 line 内部编码(设计档 §3;漏水=管网线的公众口径) */
  var CAT_LINE = { '路面': '路面', '井盖': '井盖', '漏水': '管网' };
  /* 复核确认卡用的证据示意种类(仅用于第三步/回执页的示意展示,ui.js 已有种类,不新造) */
  var CAT_KIND = { '路面': 'pothole', '井盖': 'manhole-missing', '漏水': 'field' };
  var STEP_LABEL = ['拍一张', '定位 + 类目', '确认提交'];

  function seedState() {
    return { step: 1, photo: false, block: 'Zakher', facility: null, cat: null, reportId: null };
  }
  var ST = seedState();

  /* ---------- 小工具 ---------- */
  function matchFacilities(block, cat) {
    if (!block || !cat) return [];
    var line = CAT_LINE[cat];
    return (w.DATA.facilities || []).filter(function (f) { return f.block === block && f.line === line; });
  }
  /* 同一设施上是否已有「还在走」的线索(open=待核查/confirmed=已确认但未闭环)——供去重合并判断用 */
  function findActiveClue(facilityId) {
    if (!facilityId) return null;
    var clues = w.S.get().clues, i;
    for (i = 0; i < clues.length; i++) {
      if (clues[i].facility === facilityId && (clues[i].status === 'open' || clues[i].status === 'confirmed')) return clues[i];
    }
    return null;
  }
  function addrText(facilityId, block) {
    return facilityId ? UI.addr(facilityId) : (UI.esc(block) + ' · Al Ain');
  }
  function stepDots(n) {
    var i, html = '<div class="step-dots">';
    for (i = 1; i <= 3; i++) {
      html += '<span class="step-dot' + (i === n ? ' is-on' : '') + '">' + i + '</span>' +
        '<span class="tiny">' + UI.esc(STEP_LABEL[i - 1]) + '</span>';
      if (i < 3) html += '<span class="step-line"></span>';
    }
    return html + '</div>';
  }

  /* ---------- 三步 + 回执页 ---------- */
  function renderStep1() {
    return stepDots(1) +
      '<div class="card">' +
      '<div class="sec-title">第一步 · 拍一张</div>' +
      '<div class="tiny" style="margin-bottom:8px">把镜头对准问题位置,点击下方按钮模拟拍摄(全站零真实照片,证据均为矢量示意)。</div>' +
      UI.evidenceCard('field', ST.photo ? '已拍摄 1 张(矢量示意)' : '取景框示意 · 尚未拍摄') +
      '<div class="row wrap" style="margin-top:10px">' +
      (ST.photo
        ? '<button type="button" class="btn" data-nav="retake">重新拍摄</button>' +
          '<button type="button" class="btn btn-primary grow" data-nav="next1">下一步:定位与类目 →</button>'
        : '<button type="button" class="btn btn-primary btn-block" data-nav="photo">拍照(点击模拟拍摄)</button>') +
      '</div></div>';
  }

  function renderStep2(ctx) {
    var facs = matchFacilities(ST.block, ST.cat);
    var canNext = !!(ST.block && ST.cat);
    return stepDots(2) +
      '<div class="card">' +
      '<div class="sec-title">第二步 · 自动定位(可调)+ 类目三选</div>' +
      '<div class="tiny" style="margin-bottom:6px">已自动定位(模拟):<b>' + UI.esc(ST.block) + ' · Al Ain</b> —— 街区可在下方手动调整</div>' +
      '<label class="fl">街区(可调)</label>' +
      '<select data-nav="block">' + (ctx.blocks || []).map(function (b) {
        return '<option value="' + UI.esc(b) + '"' + (b === ST.block ? ' selected' : '') + '>' + UI.esc(b) + '</option>';
      }).join('') + '</select>' +
      '<label class="fl">类目(三选一)</label>' +
      '<div class="row wrap">' + (ctx.cats || []).map(function (c) {
        return '<button type="button" class="btn' + (ST.cat === c ? ' btn-primary' : '') + '" data-nav="cat" data-val="' + UI.esc(c) + '">' + UI.esc(c) + '</button>';
      }).join('') + '</div>' +
      (ST.cat ? (
        '<label class="fl">最近设施(可选,便于精确定位;不选也可按街区提交)</label>' +
        (facs.length
          ? '<div class="row wrap">' + facs.map(function (f) {
              return '<button type="button" class="btn btn-sm' + (ST.facility === f.id ? ' btn-primary' : '') + '" data-nav="facility" data-val="' + UI.esc(f.id) + '">' +
                UI.esc(f.id) + (f.landmark ? ' · ' + UI.esc(f.landmark) : '') + '</button>';
            }).join('') + '</div>'
          : '<div class="tiny">该街区暂无「' + UI.esc(ST.cat) + '」类登记设施,将按街区定位提交</div>')
      ) : '') +
      '</div>' +
      '<div class="row wrap" style="margin-top:10px">' +
      '<button type="button" class="btn" data-nav="back2">← 上一步</button>' +
      '<button type="button" class="btn btn-primary grow' + (canNext ? '' : ' is-off') + '"' + (canNext ? '' : ' disabled') +
      ' data-nav="next2">下一步:确认提交 →</button>' +
      '</div>';
  }

  function renderStep3(ctx) {
    var kind = CAT_KIND[ST.cat] || 'field';
    var reportId = 'PR-0' + (400 + (ctx.reports || []).length);
    var params = { actor: '公众', cat: ST.cat, block: ST.block, facility: ST.facility, reportId: reportId };
    return stepDots(3) +
      '<div class="card">' +
      '<div class="sec-title">第三步 · 确认提交</div>' +
      UI.evidenceCard(kind, '示意:' + ST.cat + '类问题(AI 生成示意)') +
      UI.kv([
        ['类目', ST.cat],
        ['位置', addrText(ST.facility, ST.block), true],
        ['照片', ST.photo ? '已附 1 张(矢量示意)' : '未附']
      ]) +
      '</div>' +
      '<div class="card">' +
      '<div class="sec-title">系统会自动执行(防滥用三件)</div>' +
      '<ul class="tiny" style="margin:0;padding-left:16px;line-height:1.7">' +
      '<li><b>同点位去重合并</b>:该设施若已有活跃线索,本次上报将直接并入既有事件,不重复开单——本 demo 可现场触发(见回执页)。</li>' +
      '<li><b>单设备限频</b>:短时间内同设备多次上报会被限流——静态前端无真实设备指纹,此处仅作机制说明。</li>' +
      '<li><b>重复无效上报降权</b>:反复被判无效的上报来源降权,不进入优先分诊——同上,机制说明。</li>' +
      '</ul></div>' +
      '<div class="row wrap" style="margin-top:10px"><button type="button" class="btn" data-nav="back3">← 上一步</button></div>' +
      '<div style="margin-top:8px">' + UI.actionPanel([{ action: 'public_report', label: '提交上报', params: params, cls: 'btn-primary btn-block' }]) + '</div>' +
      '<div class="tiny" style="margin-top:6px">提交后并入线索池,按复核员同规甄别;不直接进应急。</div>';
  }

  function renderReceipt(ctx) {
    var r = (ctx.reports || []).filter(function (x) { return x.id === ST.reportId; })[0];
    if (!r) {
      return UI.banner('warn', '未找到该受理记录(可能刚重置过演示),请重新提交。') +
        '<button type="button" class="btn btn-block" style="margin-top:8px" data-nav="new">重新开始</button>';
    }
    var mergedClue = r.mergedInto ? w.S.find.clue(r.mergedInto) : null;
    var mergeLine = '';
    if (mergedClue) {
      var state = mergedClue.alertId ? ('对应告警 ' + mergedClue.alertId + ' 处理中') : ('线索 ' + mergedClue.id + ' 待复核员确认');
      mergeLine = UI.banner('info', '<b>已合并入既有事件,进度同步</b> —— ' + UI.esc(state) + ';证据已叠加(同点位去重合并)。');
    }
    return '<div class="card" style="text-align:center">' +
      '<div class="sec-title">受理成功</div>' +
      '<div style="font-size:20px;font-weight:700;color:var(--ink-hi);margin:4px 0">' + UI.esc(r.receipt) + '</div>' +
      '<div class="tiny">受理编号 ' + UI.esc(r.id) + ' · 受理时刻 ' + UI.esc(r.t) + '</div>' +
      '</div>' +
      mergeLine +
      '<div class="card">' + UI.kv([
        ['状态', r.status],
        ['类目', r.cat],
        ['位置', addrText(r.facility, r.block), true],
        ['联系方式(列级脱敏)', r.contact],
        ['催办次数', r.urges + ' 次']
      ]) + '</div>' +
      '<div class="card">' +
      '<div class="sec-title">同一个问题还没解决?</div>' +
      '<div class="tiny" style="margin-bottom:8px">再次针对同一问题上报会被记为「催办」,不会另开重复记录。</div>' +
      UI.actionPanel([{ action: 'public_urge', label: '催办(同一问题再次上报)', params: { actor: '公众', reportId: r.id }, cls: 'btn-block' }]) +
      '</div>' +
      '<button type="button" class="btn btn-block" style="margin-top:8px" data-nav="new">提交新的问题</button>' +
      '<div class="tiny" style="margin-top:8px;text-align:center"><a href="app.html">打开城市工作台(复核员/管理者视角)查看后续处置 →</a></div>';
  }

  /* ---------- 向导态导航(UI-only,不进 store;data-nav 委托点击 + 自派发 render 重绘) ---------- */
  d.addEventListener('click', function (e) {
    var el = e.target;
    while (el && el !== d && !(el.getAttribute && el.getAttribute('data-nav'))) el = el.parentNode;
    if (!el || !el.getAttribute) return;
    var nav = el.getAttribute('data-nav');
    if (!nav) return;
    e.preventDefault();
    if (nav === 'photo') ST.photo = true;
    else if (nav === 'retake') ST.photo = false;
    else if (nav === 'next1') { if (ST.photo) ST.step = 2; }
    else if (nav === 'back2') ST.step = 1;
    else if (nav === 'cat') { ST.cat = el.getAttribute('data-val'); ST.facility = null; }
    else if (nav === 'facility') ST.facility = el.getAttribute('data-val');
    else if (nav === 'next2') { if (ST.block && ST.cat) ST.step = 3; }
    else if (nav === 'back3') ST.step = 2;
    else if (nav === 'new') ST = seedState();
    else return;
    w.dispatchEvent(new CustomEvent('render'));
  });
  d.addEventListener('change', function (e) {
    var el = e.target;
    if (el && el.getAttribute && el.getAttribute('data-nav') === 'block') {
      ST.block = el.value; ST.facility = null;
      w.dispatchEvent(new CustomEvent('render'));
    }
  });

  /* 提交按钮走 data-act → UI.bindActions → S.commit(唯一状态变更入口);这里只在提交成功后
     ①切到回执页 ②若该设施已有活跃线索则现场触发一次 auto_dedupe(去重合并,M10)。
     不直接改 state——auto_dedupe 本身也是走 S.commit,一样记一条动作日志(机械不豁免审计)。 */
  w.addEventListener('render', function (e) {
    var log = e && e.detail && e.detail.log;
    if (!log || log.action !== 'public_report') return;
    var rid = log.params && log.params.reportId;
    if (!rid) return;
    ST.reportId = rid; ST.step = 'receipt';
    var clue = findActiveClue(ST.facility);
    if (clue) w.S.commit('auto_dedupe', { actor: '规则引擎', reportId: rid, clueId: clue.id });
  });

  return function VIEW_PUBLIC(ctx) {
    if (ST.step === 'receipt') return renderReceipt(ctx);
    if (ST.step === 1) return renderStep1();
    if (ST.step === 2) return renderStep2(ctx);
    return renderStep3(ctx);
  };
})(window, document);
</script>
<!-- ===== 页面体 · 归属 W1-E 工兵 · 结束 ===== -->

<script>
/* ============ 壳:渲染框架(W0 地基件,W1 勿改)============ */
(function (w, d) {
  'use strict';
  function render() {
    d.getElementById('clock').textContent = w.S.now();
    var ctx = { reports: w.S.get().publicReports, blocks: w.DATA.dict.blocks, cats: ['路面', '井盖', '漏水'] };
    var body = '';
    try { body = w.VIEW_PUBLIC ? w.VIEW_PUBLIC(ctx) : ''; }
    catch (e) { body = UI.banner('danger', '页面渲染异常:' + UI.esc(e.message)); }
    d.getElementById('view').innerHTML = UI.banners('public') + body;
  }
  d.getElementById('btnReset').addEventListener('click', function (e) { e.preventDefault(); w.S.reset(); });
  w.addEventListener('render', render);
  UI.bindActions(d);
  render();
})(window, document);
</script>
</body>
</html>
