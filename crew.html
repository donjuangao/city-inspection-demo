<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>班组处置端 · 设施智能巡检(演示原型)</title>
<link rel="stylesheet" href="assets/tokens.css">
</head>
<body>

<div class="mob">
  <header class="mob-top">
    <b>班组处置端</b>
    <span class="top-clock" id="clock">19:00</span>
    <span class="top-spacer" style="flex:1"></span>
    <select id="crewSel" style="width:auto;font-size:12px"></select>
  </header>

  <main class="mob-body" id="view"></main>

  <footer class="mob-foot">
    动作写回客户系统 · 证据双写进证据链——操作界面,不是第二真源(R67)<br>
    <span class="tiny">离线/无信号时本地暂存,回连补传(P9 浅演示)· 全站虚构演示数据,零真实照片</span>
    <span style="float:right"><a href="#" id="btnReset">重置演示</a></span>
  </footer>
</div>

<div class="toasts"></div>

<script src="assets/data.js"></script>
<script src="assets/store.js"></script>
<script src="assets/ui.js"></script>

<!-- ===== 页面体 · 归属 W1-C 工兵 · 开始 =====
     规格:施工图 §7 crew.html + §5 crew 动作行 + 设计档 §3「移动端页面细节」/ §2.3b③ 回传闭环 / §0.8.2 第5步接单
     W1-C 工兵填充位:已实现班组处置端四块流(新工单卡→工单详情→现场回传→完工提交)+ 动作族全量。
     四块流:①新工单卡(类目/位置/建议时限/接单键;快车道件标「系统自动派单」)
             ②工单详情(证据示意+导航示意 SVG+状态写回说明)
             ③现场回传(修复前/后双照=两个 evidenceSvg 占位点击「拍摄」填充)
             ④完工提交(触发 AI 复验提示)
     动作族(施工图 §5 crew 行,全部上屏):
       crew_accept 接单 / crew_arrive 到场 / crew_photo 现场回传(phase='修复前'|'修复后')
       crew_done 完工提交 / crew_reject 拒单(理由码) / crew_blocked 受阻上报(原因码)
       crew_safety 安全上报(置顶红) / crew_report_new 现场新增上报(产线索)
       crew_partial_done 部分完工 / crew_handover 交接
     铁律:S.commit 是唯一状态变更入口;班组动作 params 一律显式带 actor:'班组账号'(不依赖 state.role 兜底);
           灰态按钮 = S.check 取原因 + 可见文字展示(R53,移动端无 hover,不能只放 title 提示)。
     =============================================================== -->
<script>
(function (w, d) {
  'use strict';
  var esc = UI.esc;

  /* ---------------- 小工具 ---------------- */
  var TSTATE_TONE = {
    '已派工': 'grey', '已接单': 'blue', '已到场': 'blue', '已完工': 'amber', '已验收': 'green',
    '待条件': 'amber', '现场核实中': 'amber', '现场收尾单': 'amber', '已召回': 'amber',
    '待改派': 'red', '已合并': 'grey'
  };
  function stateBadge(t) { return UI.badge(t.state, TSTATE_TONE[t.state] || 'grey'); }

  var CREW_STATUS_TONE = { '空闲': 'green', '在途': 'blue', '到场': 'blue', '在办': 'amber' };
  function crewStatusBadge(c) { return UI.badge(c.status, CREW_STATUS_TONE[c.status] || 'grey'); }

  function sameBlock(crewObj, f) { return !!(crewObj && f && crewObj.loc === f.block); }

  /* 导航示意:自建 inline SVG(非证据图但同守全站零位图标签、无命名空间声明、统一角标口径) */
  function navSvg(fromLoc, toBlock) {
    return '<svg viewBox="0 0 240 132" role="img" aria-label="导航路线示意(AI 生成示意)">' +
      '<rect x="0" y="0" width="240" height="132" fill="#eef1f4"></rect>' +
      '<path d="M40 104 Q120 24 202 46" fill="none" stroke="#1a5fb4" stroke-width="2.4" stroke-dasharray="7 5"></path>' +
      '<circle cx="40" cy="104" r="6" fill="#5b6b7c"></circle>' +
      '<circle cx="202" cy="46" r="6" fill="#c0392b"></circle>' +
      '<text x="40" y="120" font-size="10.5" fill="#243342" text-anchor="middle" font-family="sans-serif">' + esc(fromLoc || '—') + '</text>' +
      '<text x="202" y="34" font-size="10.5" fill="#c0392b" text-anchor="middle" font-family="sans-serif">' + esc(toBlock || '—') + '</text>' +
      '<g><rect x="8" y="8" width="86" height="17" rx="3" fill="#243342" opacity="0.82"></rect>' +
      '<text x="51" y="20" font-size="10.5" fill="#ffffff" text-anchor="middle" font-family="sans-serif">AI 生成示意</text></g>' +
      '</svg>';
  }

  /* ---------------- ① 新工单卡 ---------------- */
  function newJobCard(t) {
    var f = w.S.find.facility(t.facility);
    var fastlane = t.source === w.S.dict().ticketSources.auto;
    var clue = t.clueId ? w.S.find.clue(t.clueId) : null;
    var badges = [UI.badge(t.type, 'blue')];
    if (fastlane) badges.push(UI.badge('系统自动派单', 'amber'));
    var html = '<div class="card card-tight">';
    html += '<div class="objcard-id">' + esc(t.id) + ' ' + badges.join(' ') + '</div>';
    html += '<div class="objcard-l2">类目:' + esc(t.line || '—') + (clue && clue.kindText ? ' · ' + esc(clue.kindText) : '') + '</div>';
    html += '<div class="objcard-l3">位置:' + UI.addr(t.facility) + (f && f.landmark ? ' <span class="faint">(' + esc(f.landmark) + ')</span>' : '') + '</div>';
    html += '<div class="objcard-l3">建议时限:接单 ' + UI.sla(t.sla.accept) + ' · 到场 ' + UI.sla(t.sla.arrive) + '</div>';
    html += UI.actionPanel([{ action: 'crew_accept', params: { ticketId: t.id, actor: '班组账号' }, label: '接单', cls: 'btn-primary' }]);
    html += rejectMiniForm(t);
    html += '</div>';
    return html;
  }

  /* ---------------- 动作族小表单(需用户选码/选目标,不能用静态 data-p)---------------- */
  function rejectMiniForm(t) {
    var codes = w.S.dict().reasonCodes.crew_reject;
    var chk = w.S.check('crew_reject', { ticketId: t.id, code: codes[0], actor: '班组账号' });
    return '<div class="act-item" style="margin-top:6px">' +
      '<span style="display:inline-flex;gap:4px;align-items:center;flex-wrap:wrap">' +
      '<select id="rj-' + esc(t.id) + '" style="width:auto;font-size:12px"' + (chk.ok ? '' : ' disabled') + '>' +
      codes.map(function (c) { return '<option value="' + esc(c) + '">' + esc(c) + '</option>'; }).join('') +
      '</select>' +
      '<button type="button" class="btn btn-sm' + (chk.ok ? '' : ' is-off') + '"' + (chk.ok ? '' : ' disabled') +
      ' onclick="CREW_ACT.reject(\'' + t.id + '\')">拒单</button></span>' +
      (chk.ok ? '' : '<span class="act-why">未满足:' + esc(chk.reason) + '</span>') +
      '</div>';
  }
  function blockedMiniForm(t) {
    var codes = w.S.dict().reasonCodes.crew_blocked;
    var chk = w.S.check('crew_blocked', { ticketId: t.id, code: codes[0], actor: '班组账号' });
    return '<div class="act-item">' +
      '<span style="display:inline-flex;gap:4px;align-items:center;flex-wrap:wrap">' +
      '<select id="bk-' + esc(t.id) + '" style="width:auto;font-size:12px"' + (chk.ok ? '' : ' disabled') + '>' +
      codes.map(function (c) { return '<option value="' + esc(c) + '">' + esc(c) + '</option>'; }).join('') +
      '</select>' +
      '<button type="button" class="btn btn-sm' + (chk.ok ? '' : ' is-off') + '"' + (chk.ok ? '' : ' disabled') +
      ' onclick="CREW_ACT.blocked(\'' + t.id + '\')">受阻上报</button></span>' +
      (chk.ok ? '' : '<span class="act-why">未满足:' + esc(chk.reason) + '</span>') +
      '</div>';
  }
  function handoverMiniForm(t, crewId) {
    var others = w.S.get().crews.filter(function (c) { return c.id !== crewId; });
    if (!others.length) return '';
    var chk = w.S.check('crew_handover', { ticketId: t.id, toCrew: others[0].id, actor: '班组账号' });
    return '<div class="act-item">' +
      '<span style="display:inline-flex;gap:4px;align-items:center;flex-wrap:wrap">' +
      '<select id="ho-' + esc(t.id) + '" style="width:auto;font-size:12px"' + (chk.ok ? '' : ' disabled') + '>' +
      others.map(function (c) { return '<option value="' + esc(c.id) + '">' + esc(c.name) + '</option>'; }).join('') +
      '</select>' +
      '<button type="button" class="btn btn-sm' + (chk.ok ? '' : ' is-off') + '"' + (chk.ok ? '' : ' disabled') +
      ' onclick="CREW_ACT.handover(\'' + t.id + '\')">交接</button></span>' +
      (chk.ok ? '' : '<span class="act-why">未满足:' + esc(chk.reason) + '</span>') +
      '</div>';
  }

  /* ---------------- ② 工单详情 ---------------- */
  function ticketStage(t) {
    if (t.state === '已完工' || t.state === '已验收') return 4;
    if (t.state === '已到场') return 3;
    return 2;
  }
  function stepDots(stage) {
    var labels = ['接单', '详情', '回传', '提交'], html = '<div class="step-dots">';
    for (var i = 1; i <= 4; i++) {
      html += '<span class="step-dot' + (i <= stage ? ' is-on' : '') + '">' + i + '</span>';
      html += '<span class="tiny">' + labels[i - 1] + '</span>';
      if (i < 4) html += '<span class="step-line"></span>';
    }
    return html + '</div>';
  }

  function ticketBlock(t, crewObj) {
    var crewId = crewObj.id;
    var f = w.S.find.facility(t.facility);
    var clue = t.clueId ? w.S.find.clue(t.clueId) : null;
    var html = '<div class="card">';
    html += stepDots(ticketStage(t));
    html += '<div class="objcard-id">' + esc(t.id) + ' ' + UI.badge(t.type, 'blue') + ' ' + stateBadge(t) + '</div>';
    html += '<div class="objcard-l2">关于:' + (f ? esc(f.kind) + ' ' : '') + UI.addr(t.facility) +
      (f && f.landmark ? ' <span class="faint">(' + esc(f.landmark) + ')</span>' : '') + '</div>';
    html += '<div class="objcard-l3">类目:' + esc(t.line || '—') +
      (clue ? ' · 关联线索 ' + esc(clue.id) + '(' + (clue.status === 'confirmed' ? '已确认为告警' : '待复核员确认') + ')' : '') + '</div>';
    if (t.suspended) html += '<div class="objcard-l3" style="color:var(--amberw)">已挂起:' + esc(t.suspendReason || '') + '(SLA 停表,条件解除后自动回队)</div>';
    if (t.phase) html += '<div class="objcard-l3">处置阶段:' + esc(t.phase) + '</div>';
    if (t.rejectNote) html += '<div class="objcard-l3" style="color:var(--red)">复验打回:' + esc(t.rejectNote) + ' —— 请核实现场后重新提交;如有异议可联系复核主管申诉</div>';
    html += '<div class="objcard-l3">状态写回:区市政工单系统镜像 ' + esc(t.mirror) +
      '(状态机 已派工→已接单→已到场→已完工→已验收 逐格映射,§2.3b②;操作界面不是第二真源)</div>';

    html += '<div class="ev-grid" style="margin-top:10px">';
    html += UI.evidenceGrid(clue ? clue.evidence : [{ kind: 'field', label: 'AI 生成示意' }]);
    html += '<div class="ev">' + navSvg(crewObj.loc, f ? f.block : (t.facility || '—')) +
      '<div class="ev-cap">导航示意 · 预计 ' + UI.assume(sameBlock(crewObj, f) ? '3' : '6', '导航耗时按班组当前辖区与设施街区粗估,假设值') + ' 分钟</div></div>';
    html += '</div>';

    var acts = [];
    if (t.state === '已接单') acts.push({ action: 'crew_arrive', params: { ticketId: t.id, actor: '班组账号' }, label: '到场' });
    if (t.state === '已到场') acts.push({ action: 'crew_partial_done', params: { ticketId: t.id, actor: '班组账号' }, label: '部分完工(临时措施先行)' });
    if (acts.length) html += UI.actionPanel(acts);

    html += '<div class="col" style="gap:6px;margin-top:6px">';
    html += rejectMiniForm(t);
    html += blockedMiniForm(t);
    html += handoverMiniForm(t, crewId);
    html += '</div>';
    html += '</div>';

    if (['已到场', '已完工', '已验收'].indexOf(t.state) >= 0) {
      html += fieldReturnCard(t);
      html += completionCard(t);
    }
    return html;
  }

  /* ---------------- ③ 现场回传 ---------------- */
  function fieldReturnCard(t) {
    var phases = ['修复前', '修复后'];
    var cards = phases.map(function (ph) {
      var existing = (t.photos || []).filter(function (p) { return p.phase === ph; })[0];
      if (existing) {
        return '<div class="ev">' + UI.evidenceSvg(existing.kind) +
          '<div class="ev-cap">' + esc(ph) + ' · ' + esc(existing.t) + ' 已回传</div></div>';
      }
      var panel = UI.actionPanel([{ action: 'crew_photo', params: { ticketId: t.id, phase: ph, actor: '班组账号' }, label: '拍摄' }]);
      return '<div class="ev" style="display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:150px;padding:10px;gap:6px">' +
        '<span class="tiny">' + esc(ph) + '照片待拍摄</span>' + panel + '</div>';
    }).join('');
    return '<div class="card"><div class="sec-title">③ 现场回传 · 修复前/后双照</div><div class="ev-grid">' + cards + '</div></div>';
  }

  /* ---------------- ④ 完工提交 ---------------- */
  function completionCard(t) {
    var html = '<div class="card"><div class="sec-title">④ 完工提交</div>';
    if (t.state === '已到场') {
      html += UI.actionPanel([{ action: 'crew_done', params: { ticketId: t.id, actor: '班组账号' }, label: '完工提交', cls: 'btn-primary' }], { showHint: true });
    } else if (t.state === '已完工') {
      if (!t.verify) html += UI.banner('info', '已提交完工,写回客户工单系统;已触发 AI 复验(修复前后配准判定),结果将在剧情推进后更新。');
      else if (t.verify === '存疑待人裁') html += UI.banner('warn', 'AI 复验:配准判不出 → 存疑待人裁(永不默认打回);等待复核员在工作台人工裁定。');
      else if (t.verify === '已打回') html += UI.banner('danger', '复验已打回,详情见上方备注;请核实后重新提交完工。');
    } else if (t.state === '已验收') {
      html += UI.banner('ok', '复验人裁合格,工单已验收,闭环完成——全程动作可在工作台时间线回查。');
    }
    return html + '</div>';
  }

  /* ---------------- 动作族(非本单绑定):安全上报 / 现场新增上报 ---------------- */
  function safetyCard() {
    return '<div class="card" style="border-color:var(--red);background:var(--red-soft)">' +
      '<div class="sec-title" style="color:var(--red)">紧急 · 安全上报(置顶通道,区值班长即时通知)</div>' +
      '<input type="text" id="sf-note" placeholder="现场情况简述,如:井口周边有车流,需交通导改">' +
      '<div style="margin-top:8px"><button type="button" class="btn btn-danger btn-sm" onclick="CREW_ACT.safety()">安全上报</button></div>' +
      '</div>';
  }
  function reportNewSection(crewObj) {
    var facs = w.S.get().facilities.filter(function (f) { return (crewObj.lines || []).indexOf(f.line) >= 0; });
    var html = '<div class="card"><div class="sec-title">现场新增上报 · 产出新线索(交复核员甄别,不走视觉腿)</div>';
    html += '<label class="fl">设施</label><select id="rn-fac">' +
      facs.map(function (f) { return '<option value="' + esc(f.id) + '">' + esc(f.id) + ' · ' + esc(f.block) + '</option>'; }).join('') + '</select>';
    html += '<label class="fl">类目</label><select id="rn-cat">' +
      (crewObj.lines || []).map(function (l) { return '<option value="' + esc(l) + '">' + esc(l) + '</option>'; }).join('') + '</select>';
    html += '<label class="fl">现场情况(选填)</label><input type="text" id="rn-note" placeholder="如:井盖周边路面塌陷">';
    html += '<div style="margin-top:8px"><button type="button" class="btn btn-sm" onclick="CREW_ACT.reportNew(\'' + crewObj.id + '\')">提交上报</button></div>';
    html += '</div>';
    return html;
  }

  /* ---------------- 顶部班组概况 ---------------- */
  function crewHeaderCard(crewObj, all) {
    if (!crewObj) return UI.banner('danger', '班组不存在');
    var busy = all.filter(function (t) {
      return ['已接单', '已到场', '待条件', '现场核实中', '现场收尾单'].indexOf(t.state) >= 0;
    }).length;
    return '<div class="card card-tight">' +
      '<div class="row" style="justify-content:space-between;align-items:flex-start">' +
      '<div><b>' + esc(crewObj.name) + '</b>' + (crewObj.contractor ? ' <span class="tiny">(年度承包商)</span>' : '') +
      '<div class="tiny">辖区 ' + esc(crewObj.loc) + ' · 班次 ' + esc(crewObj.shift) + '</div>' +
      '<div class="tiny">资质:' + esc((crewObj.quals || []).join(' / ') || '—') + ' · 装备:' + esc((crewObj.gear || []).join(' / ') || '—') + '</div></div>' +
      '<div style="text-align:right">' + crewStatusBadge(crewObj) + '<div class="tiny" style="margin-top:4px">在办 ' + busy + ' 张</div></div>' +
      '</div></div>';
  }

  /* ---------------- 组装 ---------------- */
  w.VIEW_CREW = function (ctx) {
    var crewObj = ctx.crewObj, all = ctx.tickets || [];
    if (!crewObj) return UI.banner('danger', '班组不存在:' + esc(ctx.crew));
    var pending = all.filter(function (t) { return t.state === '已派工'; });
    var active = all.filter(function (t) { return t.state !== '已派工' && t.state !== '已合并'; });

    var html = crewHeaderCard(crewObj, all);
    html += safetyCard();

    html += '<div class="sec-title" style="margin-top:4px">① 新工单卡</div>';
    html += pending.length ? pending.map(newJobCard).join('') :
      '<div class="card tiny">暂无待接单工单。可切顶部班组下拉查看其他班组在办件,或到工作台点「▶ 推进剧情」触发新派单。</div>';

    if (active.length) {
      html += '<div class="sec-title" style="margin-top:10px">② 工单详情(含③现场回传 · ④完工提交)</div>';
      html += active.map(function (t) { return ticketBlock(t, crewObj); }).join('');
    }

    html += reportNewSection(crewObj);
    return html;
  };

  /* 动作族(需读取表单当前值,不走静态 data-act) */
  w.CREW_ACT = {
    reject: function (ticketId) {
      var sel = d.getElementById('rj-' + ticketId), code = sel ? sel.value : '';
      var r = w.S.commit('crew_reject', { ticketId: ticketId, code: code, actor: '班组账号' });
      if (!r.ok) UI.toast('动作未执行:' + r.reason, 'bad'); else if (r.log) UI.toast(r.log.sum, 'ok');
    },
    blocked: function (ticketId) {
      var sel = d.getElementById('bk-' + ticketId), code = sel ? sel.value : '';
      var r = w.S.commit('crew_blocked', { ticketId: ticketId, code: code, actor: '班组账号' });
      if (!r.ok) UI.toast('动作未执行:' + r.reason, 'bad'); else if (r.log) UI.toast(r.log.sum, 'ok');
    },
    handover: function (ticketId) {
      var sel = d.getElementById('ho-' + ticketId), toCrew = sel ? sel.value : '';
      var r = w.S.commit('crew_handover', { ticketId: ticketId, toCrew: toCrew, actor: '班组账号', note: '跨班次交接(演示)' });
      if (!r.ok) UI.toast('动作未执行:' + r.reason, 'bad'); else if (r.log) UI.toast(r.log.sum, 'ok');
    },
    safety: function () {
      var el = d.getElementById('sf-note'), note = el ? el.value : '';
      var r = w.S.commit('crew_safety', { note: note, actor: '班组账号' });
      if (!r.ok) UI.toast('动作未执行:' + r.reason, 'bad'); else if (r.log) UI.toast(r.log.sum, 'ok');
    },
    reportNew: function (crewId) {
      var fac = d.getElementById('rn-fac'), cat = d.getElementById('rn-cat'), note = d.getElementById('rn-note');
      var r = w.S.commit('crew_report_new', {
        facility: fac ? fac.value : '', cat: cat ? cat.value : '', note: note ? note.value : '', actor: '班组账号'
      });
      if (!r.ok) UI.toast('动作未执行:' + r.reason, 'bad'); else if (r.log) UI.toast(r.log.sum, 'ok');
    }
  };

  /* 语境:班组处置端全部动作以「班组账号」身份提交(施工图 §5;actor 已在每个 commit 显式给出,
     此处仅同步 state.role 语境,不作为授权依据——不影响 app.html 复核员角色的独立判定) */
  if (w.S.get().role !== '班组账号') { w.S.setRole('班组账号'); }
})(window, document);
</script>
<!-- ===== 页面体 · 归属 W1-C 工兵 · 结束 ===== -->

<script>
/* ============ 壳:班组上下文 + 渲染框架(W0 地基件,W1 勿改)============ */
(function (w, d) {
  'use strict';
  var CREW_KEY = 'CR-01';

  function tickets(crewId) {
    return w.S.get().tickets.filter(function (t) { return t.crew === crewId; });
  }
  function render() {
    var st = w.S.get();
    d.getElementById('clock').textContent = w.S.now();
    var sel = d.getElementById('crewSel');
    if (!sel.options.length) {
      sel.innerHTML = st.crews.map(function (c) { return '<option value="' + c.id + '">' + c.name + '</option>'; }).join('');
    }
    sel.value = CREW_KEY;
    var ctx = { crew: CREW_KEY, crewObj: w.S.find.crew(CREW_KEY), tickets: tickets(CREW_KEY) };
    var body = '';
    try { body = w.VIEW_CREW ? w.VIEW_CREW(ctx) : ''; }
    catch (e) { body = UI.banner('danger', '页面渲染异常:' + UI.esc(e.message)); }
    d.getElementById('view').innerHTML = UI.banners('crew') + body;
  }
  d.getElementById('crewSel').addEventListener('change', function (e) { CREW_KEY = e.target.value; render(); });
  d.getElementById('btnReset').addEventListener('click', function (e) { e.preventDefault(); w.S.reset(); });
  w.addEventListener('render', render);
  UI.bindActions(d);
  render();
})(window, document);
</script>
</body>
</html>
